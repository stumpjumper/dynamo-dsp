<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dynamo DSP — README</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 1.2rem; max-width: 600px; line-height: 1.6; }
  #content h1 { font-size: 1.4rem; margin: 0 0 1rem 0; }
  #content h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem 0; color: #4a9eff; border-bottom: 1px solid #333; padding-bottom: 0.3rem; }
  #content h3 { font-size: 0.95rem; margin: 1rem 0 0.4rem 0; color: #aaa; }
  #content p { margin-bottom: 0.8rem; }
  #content ul, #content ol { margin: 0.5rem 0 0.8rem 1.5rem; }
  #content li { margin-bottom: 0.3rem; }
  #content code { background: #2a2a2a; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.85em; font-family: monospace; }
  #content pre { background: #2a2a2a; padding: 0.8rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; }
  #content pre code { background: none; padding: 0; font-size: 0.8rem; }
  #content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.85rem; }
  #content th { background: #2a2a2a; padding: 0.4rem 0.6rem; text-align: left; border: 1px solid #444; }
  #content td { padding: 0.4rem 0.6rem; border: 1px solid #333; }
  #content hr { border: none; border-top: 1px solid #333; margin: 1.2rem 0; }
  #content strong { color: #e0e0e0; }
  .back { display: inline-block; margin-bottom: 1rem; color: #4a9eff; text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<a class="back" href="/">← Back</a>
<div id="content"></div>
<script>
  const md = {{ content | tojson }};
  document.getElementById('content').innerHTML = marked.parse(md);
</script>
</body>
</html>
