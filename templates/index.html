<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dynamo DSP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 1.2rem; max-width: 480px; }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .status { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; margin-bottom: 1.2rem; }
  .status.active   { background: #1a4a1a; color: #4caf50; }
  .status.inactive { background: #4a1a1a; color: #f44336; }
  .blink-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 0.75rem; }

  /* Station dropdown */
  .stream-row { display: flex; gap: 0.5rem; align-items: center; }
  .stream-row select { flex: 1; }

  /* LED gain-change meter */
  .led-wrap { margin: 0.2rem 0 0.5rem 0; }
  .led-row { display: flex; align-items: center; gap: 3px; }
  .led { flex: 1; height: 14px; border-radius: 2px; background: #111; border: 1px solid #2a2a2a; transition: background 0.06s, box-shadow 0.06s, border-color 0.06s; }
  .led.y.on { background: #c97a10; box-shadow: 0 0 7px #c97a1099; border-color: #c97a10; }
  .led.r.on { background: #c42010; box-shadow: 0 0 7px #c4201099; border-color: #c42010; }
  .led-divider { width: 3px; flex: none; height: 20px; background: #3a3a3a; border-radius: 1px; }
  .led-sublabels { display: flex; justify-content: space-between; font-size: 0.6rem; color: #444; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* VU meters */
  .vu-wrap { margin: 0.2rem 0 0.4rem 0; }
  .vu-ch { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .vu-lbl { width: 0.8rem; font-size: 0.7rem; color: #666; flex-shrink: 0; text-align: center; }
  .vu-bar { display: flex; gap: 2px; flex: 1; }
  .vu-seg { flex: 1; height: 18px; border-radius: 2px; background: #111; border: 1px solid #222;
            transition: background 0.04s, box-shadow 0.04s, border-color 0.04s; }
  .vu-seg.g.on { background: #27ae60; box-shadow: 0 0 5px #27ae6077; border-color: #27ae60; }
  .vu-seg.y.on { background: #e6a817; box-shadow: 0 0 5px #e6a81777; border-color: #e6a817; }
  .vu-seg.r.on { background: #e03010; box-shadow: 0 0 5px #e0301077; border-color: #e03010; }
  .vu-scale { display: flex; justify-content: space-between; font-size: 0.55rem; color: #444;
              padding: 2px 0 0 1.4rem; letter-spacing: 0.02em; }

  .param { margin-bottom: 1.2rem; }
  .param label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.3rem; color: #aaa; }
  .param label span { color: #e0e0e0; font-weight: bold; min-width: 5rem; text-align: right; }
  input[type=range] { width: 100%; accent-color: #4a9eff; cursor: pointer; }
  select { width: 100%; padding: 0.45rem; background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; border-radius: 4px; font-size: 0.95rem; }
  hr { border: none; border-top: 1px solid #333; margin: 1rem 0; }
  .buttons { display: flex; gap: 0.75rem; margin-top: 1.2rem; }
  button { flex: 1; padding: 0.75rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: bold; }
  .btn-apply { background: #4a9eff; color: #000; }
  .btn-stop  { background: #f44336; color: #fff; }
  .btn-start { background: #4caf50; color: #000; }
  .btn-play  { background: #4caf50; color: #000; padding: 0.45rem 0.9rem; flex: 0 0 auto; font-size: 0.95rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
  .btn-stop-sm { background: #f44336; color: #fff; padding: 0.45rem 0.9rem; flex: 0 0 auto; font-size: 0.95rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
  button:active { opacity: 0.8; }
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.5rem">
  <h1>dynamo DSP</h1>
  <a href="/readme" style="font-size:0.8rem;color:#555;text-decoration:none">README</a>
</div>
<span class="status {{ 'active' if active else 'inactive' }}">
  {% if active %}<span class="blink-dot"></span>{% endif %}
  DSP {{ 'running' if active else 'stopped' }}
</span>

<hr>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.75rem">
  <span class="section-label" style="margin-bottom:0">Stations</span>
  <a href="/stations" style="font-size:0.75rem;color:#555;text-decoration:none">Edit</a>
</div>
<form method="post" action="/stream_select">
  <div class="stream-row">
    <select name="station">
      {% for key, (name, url) in stations.items() %}
      <option value="{{ key }}" {% if key == playing_key %}selected{% endif %}>
        {% if key == playing_key %}▶  {% endif %}{{ name }}
      </option>
      {% endfor %}
    </select>
    {% if playing_key %}
    <button type="submit" class="btn-stop-sm">⏹ Stop</button>
    {% else %}
    <button type="submit" class="btn-play">▶ Play</button>
    {% endif %}
  </div>
</form>
<div id="timer-wrap" style="display:none;margin-top:0.6rem;display:flex;align-items:center;gap:0.6rem">
  <span id="timer-txt" style="font-size:0.8rem;color:#666"></span>
  <form method="post" action="/timer/reset" style="margin:0">
    <button type="submit" style="padding:0.15rem 0.5rem;font-size:0.75rem;background:#2a2a2a;color:#888;border:1px solid #444;border-radius:4px;cursor:pointer;font-weight:normal">↺ Reset</button>
  </form>
</div>

<hr>
<div class="section-label">Level</div>
<div class="vu-wrap">
  <div class="vu-ch">
    <span class="vu-lbl">L</span>
    <div class="vu-bar" id="vu-l"></div>
  </div>
  <div class="vu-ch">
    <span class="vu-lbl">R</span>
    <div class="vu-bar" id="vu-r"></div>
  </div>
  <div class="vu-scale">
    <span>-60</span>
    <span>-30</span>
    <span>-20</span>
    <span>-12</span>
    <span>-9</span>
    <span>-6</span>
    <span>0</span>
  </div>
</div>

<hr>
<div class="section-label">Gain Change</div>
<div class="led-wrap">
  <div class="led-row">
    <span class="led y" id="L5"></span>
    <span class="led y" id="L4"></span>
    <span class="led y" id="L3"></span>
    <span class="led y" id="L2"></span>
    <span class="led y" id="L1"></span>
    <span class="led-divider"></span>
    <span class="led r" id="R1"></span>
    <span class="led r" id="R2"></span>
    <span class="led r" id="R3"></span>
    <span class="led r" id="R4"></span>
    <span class="led r" id="R5"></span>
  </div>
  <div class="led-sublabels">
    <span>▼ quiet</span>
    <span>loud ▲</span>
  </div>
</div>

<hr>
<div class="section-label">TAP Dynamics</div>
<form method="post" action="/apply">
  <div class="param">
    <label>Attack <span id="atk-val">{{ attack|int }} ms</span></label>
    <input type="range" name="attack" min="1" max="2000" value="{{ attack|int }}"
           oninput="document.getElementById('atk-val').textContent=this.value+' ms'">
  </div>
  <div class="param">
    <label>Release <span id="rel-val">{{ release|int }} ms</span></label>
    <input type="range" name="release" min="1" max="5000" value="{{ release|int }}"
           oninput="document.getElementById('rel-val').textContent=this.value+' ms'">
  </div>
  <div class="param">
    <label>Transition Level <span id="off-val">{{ offset_gain }} dB</span></label>
    <input type="range" name="offset_gain" min="-20" max="0" step="0.5" value="{{ offset_gain }}"
           oninput="document.getElementById('off-val').textContent=this.value+' dB'">
  </div>
  <div class="param">
    <label>Makeup Gain <span id="mkp-val">{{ makeup_gain }} dB</span></label>
    <input type="range" name="makeup_gain" min="-20" max="20" step="0.5" value="{{ makeup_gain }}"
           oninput="document.getElementById('mkp-val').textContent=this.value+' dB'">
  </div>
  <hr>
  <div class="param">
    <label>Stereo Mode</label>
    <select name="stereo_mode">
      <option value="0" {{ 'selected' if stereo_mode == 0 }}>Linked stereo</option>
      <option value="1" {{ 'selected' if stereo_mode == 1 }}>Left only</option>
      <option value="2" {{ 'selected' if stereo_mode == 2 }}>Right only</option>
    </select>
  </div>
  <div class="param">
    <label>Function</label>
    <select name="function">
      <option value="8"  {{ 'selected' if function == 8  }}>Expand 1:2 (gentle)</option>
      <option value="9"  {{ 'selected' if function == 9  }}>Expand 1:3 (medium)</option>
      <option value="10" {{ 'selected' if function == 10 }}>Expand 1:4 (aggressive)</option>
    </select>
  </div>
  <div class="buttons">
    <button type="submit" class="btn-apply">Apply</button>
  </div>
</form>

<form method="post" action="/toggle">
  <div class="buttons" style="margin-top: 0.5rem;">
    {% if active %}
    <button type="submit" class="btn-stop">Stop DSP</button>
    {% else %}
    <button type="submit" class="btn-start">Start DSP</button>
    {% endif %}
  </div>
</form>

<script>
// VU meter segment boundaries: [dBFS threshold, color-class]
const VU_SEGS = [
  [-60,'g'],[-52,'g'],[-44,'g'],[-38,'g'],[-33,'g'],[-28,'g'],
  [-25,'g'],[-22,'g'],[-20,'g'],[-18,'g'],[-16,'g'],[-14,'g'],
  [-12,'g'],[-11,'g'],[-10,'g'],[-9,'g'],
  [-8,'y'],[-7,'y'],[-6,'y'],[-5,'y'],
  [-4,'r'],[-3,'r'],[-2,'r'],[-1,'r']
];

function makeVU(id) {
  const bar = document.getElementById(id);
  VU_SEGS.forEach(([db, cls]) => {
    const s = document.createElement('span');
    s.className = 'vu-seg ' + cls;
    s.dataset.db = db;
    bar.appendChild(s);
  });
}

function updateVU(id, db) {
  const segs = document.getElementById(id).children;
  for (let i = 0; i < segs.length; i++) {
    segs[i].classList.toggle('on', db >= parseInt(segs[i].dataset.db));
  }
}

makeVU('vu-l');
makeVU('vu-r');

// Gain change LED state
const leds = {
  y: ['L5','L4','L3','L2','L1'],
  r: ['R1','R2','R3','R4','R5']
};

const sse = new EventSource('/levels');
sse.onmessage = function(e) {
  const parts = e.data.split(':');
  const idx       = parseInt(parts[0]);
  const dbL       = parseFloat(parts[1]);
  const dbR       = parseFloat(parts[2]);
  const remaining = parseInt(parts[3]);

  // Gain change LEDs
  for (let i = 1; i <= 5; i++) {
    document.getElementById('L' + i).classList.toggle('on', idx < 0 && i <= -idx);
    document.getElementById('R' + i).classList.toggle('on', idx > 0 && i <= idx);
  }

  // VU meters
  updateVU('vu-l', dbL);
  updateVU('vu-r', dbR);

  // Sleep timer
  const wrap = document.getElementById('timer-wrap');
  const txt  = document.getElementById('timer-txt');
  if (remaining >= 0) {
    wrap.style.display = 'flex';
    const mins = Math.ceil(remaining / 60);
    txt.textContent = mins + ' min remaining';
  } else {
    wrap.style.display = 'none';
  }
};
</script>
</body>
</html>
